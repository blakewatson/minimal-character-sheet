<include href="templates/header.html" />

<div class="page mx-auto max-w-180 px-4 py-8">
  <h1>Create Post</h1>
  <p><a href="/admin/posts">Back to Posts</a></p>

  <check if="{{ isset(@error_msg) }}">
    <div class="text-light-danger dark:text-dark-danger">{{ @error_msg }}</div>
  </check>

  <form method="POST" action="/admin/posts/create" class="mt-6">
    <label class="block">
      Title
      <input
        type="text"
        name="title"
        value="{{ isset(@post.title) ? @post.title : '' }}"
      />
    </label>

    <label class="mt-6 block">
      Content
      <!-- prettier-ignore -->
      <textarea name="body" rows="20">{{ isset(@post.body) ? @post.body : '' }}</textarea>
    </label>

    <label class="mt-6 block">
      <check if="{{ isset(@post.is_published) && @post.is_published }}">
        <true
          ><input
            type="checkbox"
            name="is_published"
            data-publish-checkbox
            checked
        /></true>
        <false
          ><input type="checkbox" name="is_published" data-publish-checkbox
        /></false>
      </check>
      Publish?
    </label>

    <check if="{{ isset(@post.is_published) && @post.is_published }}">
      <true>
        <div class="mt-3" data-publish-date>
          <label>
            Publish date<br />
            <input
              type="datetime-local"
              name="published_at"
              value="{{ @post.published_input }}"
            />
          </label>
        </div>
      </true>
      <false>
        <div class="mt-3" data-publish-date hidden>
          <label>
            Publish date<br />
            <input
              type="datetime-local"
              name="published_at"
              value="{{ date('Y-m-d\TH:i', time()) }}"
            />
          </label>
        </div>
      </false>
    </check>

    <div class="mt-8 flex items-center gap-8">
      <button class="button-primary" type="submit">Create Post</button>
      <a href="/admin/posts" class="button ml-auto">Cancel</a>
    </div>
  </form>
</div>

<include href="templates/footer.html" />
