<include href="templates/header.html" />

<div class="page mx-auto max-w-180 px-4 py-8">
  <h1>Edit banner</h1>
  <p><a href="/admin/banners">Back to Banners</a></p>

  <check if="{{ isset(@error_msg) }}">
    <div class="text-light-danger dark:text-dark-danger">{{ @error_msg }}</div>
  </check>

  <form
    method="POST"
    action="/admin/banners/edit/{{ @banner.id }}"
    class="mt-6"
  >
    <label class="block">
      Content
      <textarea name="body" rows="10">{{ @banner.body }}</textarea>
    </label>

    <div class="mt-6 flex items-end gap-4">
      <label>
        Expiration date (optional)<br />
        <input
          type="datetime-local"
          name="expires_at"
          value="{{ isset(@banner.expires_input) && @banner.expires_input ? @banner.expires_input : (@banner.expires_at ? date('Y-m-d\TH:i', strtotime(@banner.expires_at)) : '') }}"
        />
      </label>

      <button class="button" type="button" id="clear-expiration">Clear</button>
    </div>

    <div class="mt-6 flex items-center gap-6">
      <label>
        <check if="{{ @banner.published_at || @banner.is_published }}">
          <true
            ><input
              type="checkbox"
              name="is_published"
              data-publish-checkbox
              checked
          /></true>
          <false
            ><input type="checkbox" name="is_published" data-publish-checkbox
          /></false>
        </check>
        Publish?
      </label>

      <label>
        <check if="{{ @banner.dismissible }}">
          <true><input type="checkbox" name="dismissible" checked /></true>
          <false><input type="checkbox" name="dismissible" /></false>
        </check>
        Dismissible?
      </label>
    </div>

    <div>
      <check if="{{ @banner.published_at || @banner.is_published }}">
        <true>
          <div class="mt-3" data-publish-date>
            <label>
              Publish date<br />
              <input
                type="datetime-local"
                name="published_at"
                value="{{ isset(@banner.published_input) && @banner.published_input ? @banner.published_input : date('Y-m-d\TH:i', strtotime(@banner.published_at)) }}"
              />
            </label>
          </div>
        </true>
        <false>
          <div class="mt-3" data-publish-date hidden>
            <label>
              Publish date<br />
              <input
                type="datetime-local"
                name="published_at"
                value="{{ date('Y-m-d\TH:i', time()) }}"
              />
            </label>
          </div>
        </false>
      </check>
    </div>

    <div class="mt-8 flex items-center gap-6 max-sm:flex-wrap max-sm:gap-4">
      <button class="button-primary max-sm:w-full" type="submit">
        Save changes
      </button>
      <a href="/admin/banners" class="button">Cancel</a>
    </div>
  </form>

  <form
    action="/admin/banners/delete/{{ @banner.id }}"
    method="POST"
    class="mt-6 flex justify-end"
  >
    <button
      type="submit"
      class="button text-light-danger dark:text-dark-danger border-light-danger dark:border-dark-danger"
    >
      Delete
    </button>
  </form>
</div>

<script>
  const publishCheckbox = document.querySelector('[data-publish-checkbox]');
  const publishDateInput = document.querySelector('[data-publish-date]');
  const clearExpirationButton = document.getElementById('clear-expiration');
  const expirationInput = document.querySelector('input[name="expires_at"]');

  publishCheckbox.addEventListener('change', () => {
    publishDateInput.toggleAttribute('hidden', !publishCheckbox.checked);
  });

  clearExpirationButton.addEventListener('click', () => {
    expirationInput.value = '';
  });
</script>

<include href="templates/footer.html" />
