<include href="templates/header.html" />

<div class="page mx-auto max-w-180 px-4 py-8">
  <h1>Edit Post</h1>
  <p>
    <a href="/dashboard">Dashboard</a> > <a href="/admin">Admin</a> >
    <a href="/admin/posts">Posts</a> > Edit
  </p>

  <check if="{{ isset(@error_msg) }}">
    <div class="text-light-danger dark:text-dark-danger">{{ @error_msg }}</div>
  </check>

  <form method="POST" action="/admin/posts/edit/{{ @post.id }}" class="mt-6">
    <label class="block">
      Title
      <input type="text" name="title" value="{{ @post.title }}" />
    </label>

    <label class="mt-6 block">
      Content
      <textarea name="body" rows="20">{{ @post.body }}</textarea>
    </label>

    <div class="mt-6">
      <label>
        <check if="{{ @post.published_at || @post.is_published }}">
          <true
            ><input
              type="checkbox"
              name="is_published"
              data-publish-checkbox
              checked
          /></true>
          <false
            ><input type="checkbox" name="is_published" data-publish-checkbox
          /></false>
        </check>
        Publish?
      </label>

      <check if="{{ @post.published_at || @post.is_published }}">
        <true>
          <div class="mt-3" data-publish-date>
            <label>
              Publish date<br />
              <input
                type="datetime-local"
                name="published_at"
                value="{{ isset(@post.published_input) && @post.published_input ? @post.published_input : date('Y-m-d\TH:i', strtotime(@post.published_at)) }}"
              />
            </label>
          </div>
        </true>

        <false>
          <div class="mt-3" data-publish-date hidden>
            <label>
              Publish date<br />
              <input
                type="datetime-local"
                name="published_at"
                value="{{ date('Y-m-d\TH:i', time()) }}"
              />
            </label>
          </div>
        </false>
      </check>
    </div>

    <div class="mt-8 flex items-center gap-6 max-sm:flex-wrap max-sm:gap-4">
      <button class="button-primary max-sm:w-full" type="submit">
        Save Changes
      </button>

      <a href="/admin/posts" class="button">Cancel</a>
    </div>
  </form>

  <form
    action="/admin/posts/delete/{{ @post.id }}"
    method="POST"
    class="mt-6 flex justify-end"
  >
    <button
      type="submit"
      class="button text-light-danger dark:text-dark-danger border-light-danger dark:border-dark-danger"
    >
      Delete
    </button>
  </form>
</div>

<include href="templates/footer.html" />
